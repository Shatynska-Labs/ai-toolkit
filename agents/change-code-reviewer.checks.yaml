# Recorded check fixtures for agents/change-code-reviewer.md
#
# Inputs only. No outcomes, no dates: a description edit invalidates the
# trigger check and a body edit invalidates the cold-run check, so a stored
# result is only ever valid against a surface that may no longer exist.
#
# The consumer is a later authoring session re-running a check after the
# library changed. Nothing in this repository reads this file — toolkit-structure
# bars repository tooling.

trigger_check:
  evaluator: >-
    A fresh context holding the candidate prompt and the name and description of
    every library asset (skills/*/SKILL.md, agents/*.md) plus every asset
    committed under .claude/ (.claude/skills/*/SKILL.md, .claude/commands/**/*.md),
    and nothing from the authoring conversation. Derive both sets by glob rather
    than from a list — the .claude/ assets are installed by an external tool and
    a fixed enumeration goes stale without an edit here to signal it.
  positive:
    prompt: >-
      The add-payment-retry change is implemented and the tests pass. Can you
      review the diff against what the change actually specified before I open
      the PR?
    expected_routing: change-code-reviewer
  negative:
    prompt: >-
      Can you review the add-payment-retry change before I start implementing
      it? I want to know whether the proposal, design and tasks actually agree
      with each other, and whether it breaks anything we already specced.
    expected_routing: change-plan-reviewer
    why_this_prompt: >-
      The two reviewers sit on either side of the same change and both answer
      to "review this change", so the plan/diff boundary is the one place this
      agent can misfire. Both prompts name the same change deliberately, so
      that only the artifact under review distinguishes them.
  displacement_probe:
    prompt: >-
      Have a look at this function and tell me if the error handling is right.
    expected_routing: none
    why_this_prompt: >-
      This agent's contract is scoped to a change's diff. An unscoped review
      request naming no change, no language and no file should reach no asset
      at all rather than being absorbed by the nearest reviewer. Recorded
      outcome from the live run: the evaluator routed it to none and named what
      would have changed that — a file extension would have pulled in `python`
      or `bash`.
  adjacency_probe:
    prompt: >-
      All tasks in add-payment-retry are checked off. Before I archive it,
      verify the implementation actually matches the change artifacts.
    expected_routing: openspec-verify-change
    why_this_prompt: >-
      openspec-verify-change also checks an implementation against a change's
      artifacts, so it is this agent's nearest competitor among the .claude/
      assets. What separates them is the moment — before the pull request here,
      before archiving there — so the probe names the archive moment and must
      not land on this agent.
  also_verified: >-
    A description edit to this agent can move prompts recorded against the
    assets it competes with, so the same evaluator run re-ran
    change-plan-reviewer's positive and negative and change-test-writer's
    positive, negative and displacement probe alongside this file's prompts.

cold_run_check:
  form: >-
    Real dispatch — `claude -p --plugin-dir <fixture>/.agent-under-test`,
    prompt on stdin, launched from the fixture root — with the drafted plugin
    (.claude-plugin, agents, skills) copied into `.agent-under-test/`, which
    the fixture's committed .gitignore excludes so the tree stays clean, and
    its plugin.json name changed to `ai-toolkit-coldrun` so it cannot collide
    with an installed ai-toolkit. Permission mode: --allowedTools limited to
    Agent, Read, Grep, Glob, Skill, Bash(git:*), Bash(bash tests/run.sh) and
    Bash(gh:*) — no write-capable tool, so a write the body attempted would be
    denied and surface in the report.
  payload: >-
    working tree: <fixture absolute path> ; change name: add-greet ; target:
    not named (default).
  fixture_recipe:
    - >-
      A bare repository as `origin`, with `git remote set-head origin main`
      so the trunk resolves from origin/HEAD.
    - >-
      On main, committed — `.gitignore` (`.agent-under-test/`); `AGENTS.md`
      requiring bash scripts with `set -euo pipefail`, ShellCheck-clean, and
      naming `bash tests/run.sh` as verification; `tests/run.sh` running
      `tests/test_*.sh`; `bin/util.sh` with a `trim` function.
    - >-
      On main, a second commit — `openspec/changes/add-greet/` with
      proposal.md (adds `bin/greet.sh`; "No other file changes"), no
      design.md, a delta spec with two requirements — greet prints
      `Hello, <name>!` and exits 0; a blank name prints `error: name required`
      to stderr, nothing to stdout, and exits 2 — tasks.md with 1.1 greet,
      1.2 reject blank with exit 2, 2.1 add `--help`, 3.1 tests, all `[x]`,
      and test-plan.md mapping both scenarios to `tests/test_greet.sh`.
    - >-
      On branch add-greet, one commit — `bin/greet.sh` exiting 1 on a blank
      name (the planted violation); `tests/test_greet.sh` asserting the greeting
      but only a non-zero exit for the blank name (a scenario mapped to a test
      that does not assert it); `bin/util.sh` with a local variable renamed
      (a correct behaviour-preserving out-of-scope edit); no `--help` (a task
      marked done with nothing behind it). Pushed, and checked out.
  pass_criteria:
    - >-
      Returned the ordinary report shape — target, summary, traceability, task
      audit, findings, considered, verification and writes, one recommended
      action. A blocked report fails the check.
    - >-
      Needed nothing the payload did not supply, and invented no path or trunk
      name.
    - >-
      Distinguished the scope edit (kind `scope`) from the planted violation
      (kind `requirement`) and the missing `--help` (kind `task`).
    - >-
      Reported any verification it could not run as not run, never as passed.
    - >-
      Wrote nothing; the fixture's `git status --porcelain` is empty after the
      run.
    - >-
      Terminated because the body directed it to, not because a budget ran out.
  static_half: >-
    Every tool the body directs the agent to use — git and gh and the project's
    verification through Bash, the practice skills through Skill, reads through
    Read, Grep and Glob — is in the tools field, and the body directs no edit.
  not_graded: The quality of the review the agent produced.
